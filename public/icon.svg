<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 184" role="img" aria-labelledby="title desc">
  <title id="title">NIM RUSH</title>
  <desc id="desc">A rider tucked low over a bike, on a badge.</desc>
  <!--
    Shapes only, no text and no gradients.

    A favicon is read at sixteen pixels. The previous one carried a sky
    gradient, a sun, a ridge, a ground line, a bike, a rider and an eight-pixel
    wordmark inside one square, which at tab size resolved to a smudge. This is
    the same mark the app uses, drawn heavy enough to survive: a badge
    silhouette, one flat colour, and a cyclist in a single ink weight.

    The offset shadow is a second rectangle rather than a filter, so it stays
    crisp wherever the file is scaled and costs nothing to render.
  -->
  <rect x="12" y="20" width="164" height="156" rx="40" fill="#14131d" />
  <rect x="4" y="12" width="164" height="156" rx="40" fill="#ffb43c" stroke="#14131d" stroke-width="8" />
  <g transform="translate(-6 4)">
  <g fill="none" stroke="#14131d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels. Heavy rings: at small sizes these carry the whole idea. -->
    <circle cx="50" cy="124" r="22" stroke-width="11" />
    <circle cx="124" cy="124" r="22" stroke-width="11" />
    <!-- Rear triangle, down tube and top tube. -->
    <path d="M50 124 88 120 74 92 50 124M88 120 118 98M74 92h36" stroke-width="10" />
    <!-- Fork. -->
    <path d="M118 98 124 124" stroke-width="10" />
    <!-- The flat back, which is the whole attitude of the reference. -->
    <path d="M70 84 106 72" stroke-width="14" />
    <!-- Arm reaching down and forward to the bars. -->
    <path d="M106 72 118 96" stroke-width="10" />
    <!-- Driving leg. -->
    <path d="M72 88 92 108 88 120" stroke-width="12" />
    <!-- Neck, so the head reads as attached rather than floating. -->
    <path d="M106 72 116 66" stroke-width="10" />
  </g>
  <circle cx="122" cy="62" r="12" fill="#14131d" />
  </g>
</svg>
