<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover plus the safe-area insets in style.css keep the HUD
      off the notch and off the home indicator. Nimiq Pay renders this in a
      WebView that goes edge to edge, so without this the timer sits under the
      status bar on most phones.

      interactive-widget=resizes-content is what makes the keyboard survivable.

      The default, resizes-visual, shrinks only the VISUAL viewport when the
      keyboard opens and leaves the layout viewport at full height. Everything
      here is laid out inside one `position: fixed` box (#app), and fixed boxes
      resolve against the LAYOUT viewport, so the app stayed full height while
      the browser scrolled the visual viewport down to reveal the field being
      typed into. The result on Android was the room clipped off the top of the
      screen with a band of empty paper between it and the keyboard: the page was
      still there, just not where anybody could see it. core/viewport.ts had
      already corrected the height from visualViewport, which made the box the
      right size in the wrong place.

      resizes-content shrinks the layout viewport instead, so the fixed box, the
      viewport units, and the height media queries all agree with what is on
      screen and the visual viewport never has to scroll. Ignored by engines that
      do not know it (Safari), which is safe: iOS resolves fixed elements against
      the visual viewport, so it never had this failure.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#101430" />
    <meta name="color-scheme" content="dark" />
    <title>NIM Atlas — Beacon Blitz</title>
    <meta
      name="description"
      content="Race 90-second Nimiq relay circuits through Lagos, London, and Dubai."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph, so a shared challenge link is not a bare URL in a feed. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NIM Atlas — Beacon Blitz" />
    <meta
      property="og:description"
      content="Ride fast. Read the network. Rule the city."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!--
      Preloaded, because the wordmark on the very first screen is set in it and
      a display face that arrives late makes the splash visibly reflow. Only the
      latin subset: the extended one is for the rare accented handle and can
      wait until something needs it.
    -->
    <link
      rel="preload"
      href="/fonts/luckiest-guy-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/atlas/atlas.css" />
  </head>
  <body>
    <!--
      Three layers. The canvas is the world and is always drawing. #ui is the
      screen on top of it. #chrome is the app bar, kept out of #ui because
      every screen mounts by replacing #ui wholesale, and a bar that is torn
      down and rebuilt on every repaint is a bar that flickers.
    -->
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
      <header id="chrome" hidden></header>
    </div>
    <script type="module" src="/src/atlas/main.ts"></script>
  </body>
</html>
